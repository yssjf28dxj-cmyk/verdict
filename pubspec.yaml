name: verdict
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.2
  vibration: ^2.0.0
  # Библиотеки для Firebase и Google входа
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  google_sign_in: ^6.2.1
  
  # Иконки для интерфейса
  font_awesome_flutter: ^10.12.0
  firebase_storage: ^13.0.0
  image_picker: ^1.2.1
  shared_preferences: ^2.3.2
  flutter_displaymode: ^0.6.0
  audioplayers: ^6.1.0
  record: ^6.0.0
  path_provider: ^2.1.4
  audio_waveforms: ^1.2.0
  firebase_crashlytics: ^5.1.0
  http: ^1.2.2
  go_router: ^17.2.0
  get_it: ^9.2.1
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: "^2.4.4"

# ── App Icon ──────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0B0E14"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0B0E14"
    theme_color: "#0B0E14"

# ── Native Splash ────────────────────────────────────────────
flutter_native_splash:
  color: "#0B0E14"
  image: "assets/logo.png"
  android_12:
    color: "#0B0E14"
    image: "assets/logo.png"
  ios: true
  android: true
  web: true

flutter:
  uses-material-design: true
  generate: true
  # Регистрация папки с картинками
  assets:
    - assets/logo.png
    - assets/sounds/